name: Build iOS IPA

on:
  workflow_dispatch:
    inputs:
      build_name:
        description: 'App Version'
        required: true
        default: '1.234'
      build_number:
        description: 'Build Number'
        required: true
        default: '1234'
  push:
    branches: [ main, master ]

jobs:
  build-ios:
    name: Build iOS IPA
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: |
          flutter doctor -v
          flutter pub get

      - name: CocoaPods Install
        run: |
          cd ios
          pod install --repo-update || true
          cd ..

      - name: Build iOS App Bundle (Release)
        run: |
          BUILD_NAME="${{ github.event.inputs.build_name || '1.234' }}"
          BUILD_NUM="${{ github.event.inputs.build_number || '1234' }}"
          flutter build ios --release --no-codesign --build-name=$BUILD_NAME --build-number=$BUILD_NUM

      - name: Package .app into valid .ipa for Sideloadly
        run: |
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -r KavachOne_1.234_Release.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: KavachOne_1.234_Release_IPA
          path: KavachOne_*_Release.ipa
          retention-days: 7
