name: Build iOS IPA

on:
  workflow_dispatch:
    inputs:
      build_name:
        description: 'App Version'
        required: false
        default: '1.236'
      build_number:
        description: 'Build Number'
        required: false
        default: '1236'

jobs:
  build-ios:
    name: Build React Capacitor iOS IPA
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Frontend Dependencies & Sync Capacitor
        run: |
          cd frontend
          npm install --legacy-peer-deps
          npm run build
          npx cap sync ios

      - name: Build Capacitor React iOS App (Release, no code signing)
        run: |
          cd frontend/ios/App
          xcodebuild -project App.xcodeproj \
                     -scheme App \
                     -configuration Release \
                     -sdk iphoneos \
                     -derivedDataPath build \
                     CODE_SIGNING_ALLOWED=NO \
                     CODE_SIGNING_REQUIRED=NO \
                     DEVELOPMENT_TEAM=0000000000 \
                     CODE_SIGN_IDENTITY=""

      - name: Package React Capacitor .app into .ipa for Sideloadly
        run: |
          mkdir -p Payload
          APP_PATH=$(find frontend/ios/App/build -name "App.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            APP_PATH=$(find frontend/ios/App -name "*.app" -type d | head -n 1)
          fi
          echo "Found App bundle at: $APP_PATH"
          cp -R "$APP_PATH" Payload/
          zip -r KavachOne_1.236_Release.ipa Payload/

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: KavachOne_1.236_Release_IPA
          path: KavachOne_1.236_Release.ipa
          retention-days: 14