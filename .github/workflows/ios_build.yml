name: Build iOS IPA

on:
  workflow_dispatch:
    inputs:
      build_name:
        description: 'App Version'
        required: false
        default: '1.234'
      build_number:
        description: 'Build Number'
        required: false
        default: '1234'

jobs:
  build-ios:
    name: Build iOS IPA
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.32.4'
          cache: true

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: CocoaPods Install
        working-directory: ios
        run: pod install

      - name: Build iOS App (Release, no code signing)
        run: |
          flutter build ios \
            --release \
            --no-codesign \
            --no-tree-shake-icons

      - name: Package .app into .ipa for Sideloadly
        run: |
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -r KavachOne_1.234_Release.ipa Payload/

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: KavachOne_1.234_Release_IPA
          path: KavachOne_1.234_Release.ipa
          retention-days: 14